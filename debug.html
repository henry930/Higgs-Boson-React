<!DOCTYPE html>
<html>
<head>
    <title>API Debug</title>
</head>
<body>
    <h1>API Debug Test</h1>
    <button onclick="testAPI()">Test API Call</button>
    <div id="output"></div>

    <script>
        async function testAPI() {
            const output = document.getElementById('output');
            output.innerHTML = 'Testing API call...';
            
            try {
                console.log('Testing API call to testimonials...');
                const response = await fetch('https://yp5h5o5ma4.execute-api.us-east-1.amazonaws.com/prod/api/testimonials/');
                console.log('Response status:', response.status);
                console.log('Response headers:', [...response.headers.entries()]);
                
                const contentType = response.headers.get('content-type');
                console.log('Content-Type:', contentType);
                
                if (!contentType || !contentType.includes('application/json')) {
                    const text = await response.text();
                    console.log('Non-JSON response:', text.substring(0, 500));
                    output.innerHTML = `<p>Non-JSON response received. Content-Type: ${contentType}</p><pre>${text.substring(0, 500)}</pre>`;
                } else {
                    const data = await response.json();
                    console.log('JSON response:', data);
                    output.innerHTML = `<p>JSON response received</p><pre>${JSON.stringify(data, null, 2)}</pre>`;
                }
            } catch (error) {
                console.error('API test error:', error);
                output.innerHTML = `<p>Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
