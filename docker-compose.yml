version: '3.8'

services:
  # Main development service
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "5174:5174"  # Vite dev server
      - "8000:8000"  # Django API
    volumes:
      # Mount source code for hot reload
      - .:/app
      - /app/node_modules  # Exclude node_modules
      - /app/server/venv   # Exclude Python venv
    environment:
      - NODE_ENV=development
      - DJANGO_ENV=development
      - DATABASE_URL=sqlite:///app/server/db.sqlite3
    stdin_open: true
    tty: true
    command: /app/start-dev.sh

  # Optional: Database service (if you want to use PostgreSQL instead of SQLite)
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=higgs_boson
      - POSTGRES_USER=developer
      - POSTGRES_PASSWORD=devpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    profiles: ["postgres"]  # Only start with --profile postgres

  # Optional: Redis for caching
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    profiles: ["cache"]  # Only start with --profile cache

volumes:
  postgres_data:
